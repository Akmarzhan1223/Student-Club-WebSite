<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Clubs - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">Student Clubs</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="sports.html">Sports</a>
            <a href="debate.html">Debate</a>
            <a href="music.html">Music</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <p>Want to join a club? Send us a message!</p>
        <form class="contact-form">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="club">Which club?</label>
            <select id="club">
                <option>Sports</option>
                <option>Debate</option>
                <option>Music</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" rows="4" placeholder="Write your message..."></textarea>

            <button type="submit">Send</button>
        </form>
        <h2>Our Contacts</h2>
        <p>Email: info@studentclubs.com</p>
        <p>Phone: +7 775 623 52 07</p>
        <p>Address: University Building, C1.1.365k</p>
    </main>

    <footer class="footer">
        <p>Contact: info@studentclubs.com</p>
        <p> Student Clubs. All rights reserved.</p>
</body>
</html>
