<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Clubs - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">Student Clubs</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="sports.html">Sports</a>
            <a href="debate.html">Debate</a>
            <a href="music.html">Music</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container my-4">
        <h1>Contact Us</h1>
        <p>Want to join a club? Send us a message!</p>

        <form class="contact-form" id="joinForm" novalidate>
            <div class="mb-3">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" class="form-control" placeholder="Enter your name">
                <div class="text-danger small" id="errName"></div>
            </div>

            <div class="mb-3">
                <label for="userEmail">Email</label>
                <input type="email" id="userEmail" class="form-control" placeholder="Enter your email">
                <div class="text-danger small" id="errEmail"></div>
            </div>

            <div class="mb-3">
                <label for="clubPick">Which club?</label>
                <select id="clubPick" class="form-select">
                    <option>Sports</option>
                    <option>Debate</option>
                    <option>Music</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="userPass">Password</label>
                <input type="password" id="userPass" class="form-control" placeholder="Create a password">
                <div id="passStrength" class="small fw-bold mt-1"></div>
                <div class="text-danger small" id="errPass"></div>
            </div>

            <div class="mb-3">
                <label for="userPass2">Confirm Password</label>
                <input type="password" id="userPass2" class="form-control" placeholder="Confirm password">
                <div id="passMatch" class="small mt-1"></div>
                <div class="text-danger small" id="errPass2"></div>
            </div>

            <div class="mb-3">
                <label for="userMsg">Message</label>
                <textarea id="userMsg" class="form-control" rows="4" placeholder="Write your message..."></textarea>
                <div class="text-danger small" id="errMsg"></div>
            </div>

            <button type="submit" class="btn btn-primary">Send</button>
        </form>

        <h2 class="mt-5">Our Contacts</h2>
        <p>Email: info@studentclubs.com</p>
        <p>Phone: +7 775 623 52 07</p>
        <p>Address: University Building, C1.1.365k</p>
    </main>

    <footer class="footer">
        <p>Contact: info@studentclubs.com</p>
        <p>Student Clubs. All rights reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
